<script>
const $=i=>document.getElementById(i),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CW=150,CH=92,SG=12,GX=22,GY=64;
let pend=null,D=[],nid=1,sel=0,rv='all',tab='e',F=nf(),dm={},lastJ={},pos={},bb={x:0,y:0,w:400,h:200},vb={x:0,y:0,w:800,h:500},ts=0,wm={},hits=[],hi=0;
const sv=$('sv');
const nI=()=>{let i=Date.now()*1000+Math.floor(Math.random()*1000);while(D.some(p=>p.id==i))i++;return i};
const mk=o=>{const p={id:nI(),n:'',g:'M',go:'',f:0,m:0,sp:[],inl:0,ad:'',ph:'',nt:'',al:1,b:{},d:{},ls:'',...o};D.push(p);return p};

const topOf=p=>{let n=0,x;while(p.f&&(x=by(p.f))&&n++<999)p=x;return p};
const Y=o=>+o.y||(+o.v?+o.v-57:0);
const age=p=>{const b=Y(p.b);if(!b)return'';const e=p.al?new Date().getFullYear():Y(p.d);return e&&e>=b?e-b:''};
const LS=p=>p.ls!==''&&p.ls!=null?p.ls:age(p);
const dt=(o,l)=>{const a=[o.d,o.m,o.y].filter(Boolean).join('/'),v=o.v?'वि.सं.'+o.v:'';return a||v?l+' '+a+(a&&v?' ('+v+')':v):''};
const gt=(p,k)=>k.split('.').reduce((a,c)=>a==null?a:a[c],p)??'';
const st=(p,k,v)=>{const a=k.split('.'),l=a.pop();let o=p;a.forEach(c=>o=o[c]);o[l]=v};
const L=s=>String(s||'').toLowerCase(),act=()=>Object.values(F).some(v=>v);
function nf(){return{t:'',g:'',go:'',ad:'',sp:'',fa:'',mo:'',st:'',y1:'',y2:'',ph:0}}
function match(p){if(!act())return false;const f=F,ss=p.sp.map(by).filter(Boolean),fa=by(p.f),mo=by(p.m);
 const all=[p.n,p.go,p.ad,p.nt,ss.map(x=>x.n+' '+x.ad+' '+x.go).join(' '),fa&&fa.n,mo&&mo.n,p.b.y,p.b.v,p.d.y,p.d.v].join(' ');
 return !!((!f.t||L(all).includes(f.t))&&(!f.g||L(p.g)==f.g)&&(!f.go||L(p.go).includes(f.go))&&(!f.ad||L(p.ad).includes(f.ad))&&(!f.sp||ss.some(x=>L(x.n).includes(f.sp)))&&(!f.fa||(fa&&L(fa.n).includes(f.fa)))&&(!f.mo||(mo&&L(mo.n).includes(f.mo)))&&(!f.st||(f.st=='a'?p.al:!p.al))&&(!f.y1||(Y(p.b)&&Y(p.b)>=+f.y1))&&(!f.y2||(Y(p.b)&&Y(p.b)<=+f.y2))&&(!f.ph||p.ph))}
function stamp(init){D.forEach(p=>{const j=JSON.stringify({...p,u:0});if(lastJ[p.id]!==j){if(!init)p.u=Date.now();lastJ[p.id]=j}})}
function bak(){try{localStorage.setItem('vv_bak',JSON.stringify({ts,D,nid,del:dm}))}catch(e){}}
function save(){stamp();ts=Date.now();try{localStorage.setItem('vv',JSON.stringify({ts,D,nid,del:dm}))}catch(e){}autoSync()}
function fix(){D.slice().forEach(c=>{const f=by(c.f);if(f&&f.g=='F'){let h=f.sp.map(by).find(x=>x&&x.g!='F');if(!h){h=mk({g:'M',inl:1,sp:[f.id]});f.sp.push(h.id)}c.m=c.m||f.id;c.f=h.id}})}
function init(){let a=null,b=null;try{b=JSON.parse(localStorage.getItem('vv'))}catch(e){}try{a=JSON.parse($('seed').textContent)}catch(e){}
 const s=[a,b].filter(x=>x&&x.D&&x.D.length).sort((x,y)=>y.ts-x.ts)[0];
 if(s){D=s.D;nid=s.nid||1;ts=s.ts;dm=s.del||{};stamp(1);fix();stamp()}else sample()}
function sample(){const a=mk({n:'रामलाल',go:'भारद्वाज',ad:'ग्राम उदाहरण, राजस्थान',b:{y:1930,v:1987},al:0,d:{y:2005,v:2062}}),
 s=mk({n:'सीता देवी',g:'F',go:'कश्यप',inl:1,ad:'ग्राम अन्य, राजस्थान',b:{y:1935,v:1992},sp:[a.id]}),
 c=mk({n:'मोहन',f:a.id,m:s.id,go:'भारद्वाज',b:{y:1955,v:2012}}),
 d=mk({n:'कमला',g:'F',f:a.id,m:s.id,b:{y:1960,v:2017}}),
 w=mk({n:'गीता',g:'F',inl:1,go:'गौतम',sp:[c.id],b:{y:1958,v:2015}});
 a.sp=[s.id];c.sp=[w.id];D=[a,s,c,d,w]}
/* layout */
const uw=p=>{const n=1+p.sp.length;return n*CW+(n-1)*SG};
function W(p){if(wm[p.id]!=null)return wm[p.id];wm[p.id]=0;const k=kids(p);const kw=k.length?k.reduce((a,c)=>a+W(c),0)+(k.length-1)*GX:0;return wm[p.id]=Math.max(uw(p),kw)}
function place(p,x,y,o){const tw=W(p),u=uw(p),ux=x+(tw-u)/2,k=kids(p);pos[p.id]={x:ux,y};o.c.push({p,x:ux,y});
 p.sp.forEach((id,i)=>{const s=by(id);if(!s)return;const sx=ux+(i+1)*(CW+SG);o.c.push({p:s,x:sx,y,s:1});pos[id]||(pos[id]={x:sx,y});o.e.push(`M${sx-SG} ${y+CH/2}H${sx}`)});
 if(k.length){const kw=k.reduce((a,c)=>a+W(c),0)+(k.length-1)*GX;let kx=x+(tw-kw)/2;const cy=y+CH+GY,my=y+CH+GY/2,px=ux+u/2,xs=[px];
  o.e.push(`M${px} ${y+CH}V${my}`);
  k.forEach(c=>{const w=W(c);place(c,kx,cy,o);const cx=pos[c.id].x+CW/2;xs.push(cx);o.e.push(`M${cx} ${cy}V${my}`);kx+=w+GX});
  o.e.push(`M${Math.min(...xs)} ${my}H${Math.max(...xs)}`)}}
let cn=0;
function card(c){const p=c.p,{x,y}=c,M=p.g=='M',F=p.g=='F',on=p.id==sel,hit=match(p),k='k'+(cn++);
 const fill=M?'#bfdbfe':F?'#fbcfe8':'#e5e7eb',sc=M?'#1d4ed8':F?'#be185d':'#6b7280',tx=x+(p.ph?46:8),T=(t,dy,sz,w,l)=>`<text x="${tx}" y="${y+dy}" font-size="${sz}" font-weight="${w||400}" fill="#222">${E(String(t).slice(0,l||24))}</text>`;
 let s=`<g class="cd" data-id="${p.id}"><rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="10" fill="${fill}" stroke="${on?'#e65100':hit?'#f59e0b':sc}" stroke-width="${on?4:hit?6:1.6}"${p.al?'':' stroke-dasharray="5 3"'}/>`;
 if(p.ph)s+=`<clipPath id="${k}"><circle cx="${x+27}" cy="${y+24}" r="17"/></clipPath><image href="${p.ph}" x="${x+10}" y="${y+7}" width="34" height="34" clip-path="url(#${k})" preserveAspectRatio="xMidYMid slice"/>`;
 s+=T(p.n||'(नाम?)',18,13,700,p.ph?15:19)+`<text x="${x+CW-16}" y="${y+16}" font-size="12" fill="${sc}">${M?'♂':F?'♀':'⚧'}</text>`;
 if(c.s&&p.f)s+=`<text x="${x+CW-16}" y="${y+32}" font-size="12" fill="#b4561b">⤴</text>`;
 s+=(p.go?T('गोत्र: '+p.go,p.ph?47:33,10.5):'')+T(p.ad?'पता: '+p.ad:'',46+(p.ph?2:0),10)+T(dt(p.b,'ज.'),60,10,0,34)+T(p.al?'जीवित':dt(p.d,'मृ.')||'मृत',72,10,0,34);
 const l=LS(p);return s+(l!==''?T('आयु: '+l+' वर्ष',85,10,600):'')+'</g>'}
function draw(){wm={};pos={};cn=0;const o={c:[],e:[]},R=rv=='all'?D.filter(p=>!p.f&&!p.inl):[by(rv)].filter(Boolean);let x=0;
 R.forEach(r=>{place(r,x,0,o);x+=W(r)+GX*3});
 let s='',x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 o.e.forEach(d=>s+=`<path d="${d}" fill="none" stroke="#8a7a62" stroke-width="1.6"/>`);
 o.c.forEach(c=>{s+=card(c);x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+CW);y1=Math.max(y1,c.y+CH)});
 bb=o.c.length?{x:x0,y:y0,w:x1-x0,h:y1-y0}:{x:0,y:0,w:400,h:200};
 $('g').innerHTML=s||'<text x="40" y="100" font-size="20" fill="#8a7a62">＋ नया व्यक्ति दबाकर शुरू करें</text>';
 const rs=$('rs'),R2=D.filter(p=>!p.f&&!p.inl);if(rv!='all'&&!R2.find(p=>p.id==rv)){const z=by(rv);z&&R2.push(z)}
 rs.innerHTML='<option value="all">🌳 सभी वंश</option>'+R2.map(p=>`<option value="${p.id}">${E(p.n||'(नाम?)')} का वंश</option>`).join('');rs.value=rv;
 $('gl').innerHTML=[...new Set(D.map(p=>p.go).concat(['भारद्वाज','कश्यप','वशिष्ठ','गौतम','अत्रि','विश्वामित्र','जमदग्नि','शांडिल्य','पराशर','कौशिक','वत्स','गर्ग']).filter(Boolean))].map(g=>`<option value="${E(g)}">`).join('')}
let rq=0;const sched=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(draw)};
/* view */
function setVB(){const r=sv.clientHeight/sv.clientWidth||.6;vb.h=vb.w*r;sv.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function fit(){const m=40,r=sv.clientHeight/sv.clientWidth||.6;vb.w=Math.max(bb.w+2*m,(bb.h+2*m)/r);vb.h=vb.w*r;vb.x=bb.x+bb.w/2-vb.w/2;vb.y=bb.y+bb.h/2-vb.h/2;setVB()}

function zoom(f,fx=.5,fy=.5){const px=vb.x+vb.w*fx,py=vb.y+vb.h*fy;vb.w*=f;vb.x=px-vb.w*fx;vb.y=py-(vb.w*(sv.clientHeight/sv.clientWidth))*fy;setVB()}
const ptr=new Map;let mv=0,pd=0;
const pdist=()=>{const c=[...ptr.values()];return c.length==2?Math.hypot(c[0][0]-c[1][0],c[0][1]-c[1][1]):0};

 else if(ptr.size==2){mv+=9;const d=pdist(),r=sv.getBoundingClientRect(),c=[...ptr.values()];if(pd)zoom(pd/d,((c[0][0]+c[1][0])/2-r.left)/r.width,((c[0][1]+c[1][1])/2-r.top)/r.height);pd=d}};

$('q').oninput=e=>{F.t=L(e.target.value.trim());upd()};

/* panel */
const TB=()=>`<div><button class="b${tab=='e'?' p':''}" data-t="e">✏ संपादन</button><button class="b${tab=='l'?' p':''}" data-t="l">📋 सूची / 🗑 हटाएँ</button><button class="b${tab=='s'?' p':''}" data-t="s">⟳ सिंक</button><button class="b" data-a="x" style="float:right">✕</button></div>`;

const CB=()=>{const x=by(pend);return x?`<div style="border:2px solid #c62828;border-radius:8px;padding:8px;margin:6px 0"><b>${E(x.n||'यह सदस्य')}</b> को हटाएँ?<br><small>संतान आदि सहित कुल ${dset(x).size} सदस्य हटेंगे। बैकअप अपने‑आप रखा जाएगा।</small><br><button class="b" style="background:#c62828;color:#fff" data-a="dyes">हाँ, हटाएँ</button><button class="b" data-a="dno">रद्द</button></div>`:''};
